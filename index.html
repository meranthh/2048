<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>2048</h1>
      <div class="score-box">
        <span class="score-title">Счёт</span>
        <span id="score">0</span>
      </div>
    </header>

    <div class="buttons">
      <button id="undo-btn" class="btn">Отменить ход</button>
      <button id="restart-btn" class="btn">Начать заново</button>
      <button id="leaders-btn" class="btn">Рекорды</button>
    </div>

    <div class="board" id="board">
      <div class="game-over hidden" id="game-over">
        <p id="game-over-text">Игра окончена!</p>
        <input type="text" id="name-input" placeholder="Ваше имя" maxlength="20">
        <button id="save-btn" class="btn">Сохранить результат</button>
        <button id="restart-btn-2" class="btn restart-icon" title="Начать заново">↻</button>
      </div>
    </div>
  </div>

  <!-- окно с таблицей лидеров -->
  <div class="modal hidden" id="leaders-modal">
    <div class="modal-content">
      <h2>Таблица лидеров</h2>
      <table>
        <thead>
          <tr>
            <th>Имя</th>
            <th>Очки</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="leaders-body"></tbody>
      </table>
      <p id="no-leaders" class="hidden">Пока нет рекордов</p>
      <button id="close-leaders" class="btn">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
