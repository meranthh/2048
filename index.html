<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>2048</h1>
      <div class="score-box">
        <span class="score-title">Счёт</span>
        <span id="score">0</span>
      </div>
    </header>

    <div class="buttons">
      <button id="undo-btn" class="btn">Отменить ход</button>
      <button id="restart-btn" class="btn">Начать заново</button>
      <button id="leaders-btn" class="btn">Рекорды</button>
    </div>

    <div class="board" id="board">
    </div>
  </div>
</body>
</html>
